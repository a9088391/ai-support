name: ai-support-test

services:
  db:
    image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    command: ["postgres", "-c", "ai_support.test_fixture=disposable-ticket01"]
    environment:
      POSTGRES_DB: ai_support_test
      POSTGRES_USER: ai_support_test
      POSTGRES_PASSWORD: disposable-fixture-only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "ai_support_test", "-d", "ai_support_test"]
      interval: 2s
      timeout: 2s
      retries: 20

  test:
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy

networks:
  default:
    internal: true
